[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bileactome"
version = "1.0.1"
description = "Command-line annotation and abundance analysis software for microbial bile acid metabolism genes"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "BSD-3-Clause AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/CC-BY-4.0.txt"]
authors = [{name = "China Agricultural University"}]
keywords = ["bile-acid", "metagenomics", "HMM", "microbiome", "bioinformatics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "biopython>=1.81,<2",
  "numpy>=1.24,<2",
  "pandas>=2.0,<3",
  "openpyxl>=3.1,<4"
]

[project.scripts]
bileactome = "bileactome.cli:main"

[project.urls]
Homepage = "https://github.com/1362996609zby/BileActome"
Issues = "https://github.com/1362996609zby/BileActome/issues"
Publication = "https://doi.org/10.1093/ismeco/ycag205"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bileactome = ["data/hmm/*.hmm", "data/*.json", "data/toy/**/*", "legacy/mag/*.py", "legacy/catalog/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

