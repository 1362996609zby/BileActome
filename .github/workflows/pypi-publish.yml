name: Publish validated CLI release to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-bileactome-1.0.0
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download immutable validated release assets
        run: |
          mkdir -p dist
          curl --fail --location --retry 3 --output dist/bileactome-1.0.0.tar.gz https://github.com/1362996609zby/BileActome/releases/download/cli-v1.0.0/bileactome-1.0.0.tar.gz
          curl --fail --location --retry 3 --output dist/bileactome-1.0.0-py3-none-any.whl https://github.com/1362996609zby/BileActome/releases/download/cli-v1.0.0/bileactome-1.0.0-py3-none-any.whl
          printf '%s\n' 'aeb4f2f02828481f664273b4a8f957aa61b15fcf70c33d6cb9f8781c8ce3593e  dist/bileactome-1.0.0.tar.gz' '5be552d9c314005aa0d0afe381afe9ac9c27a9975eae0834602076774b59b850  dist/bileactome-1.0.0-py3-none-any.whl' | sha256sum --check --strict
      - name: Check distribution metadata
        run: |
          python -m pip install 'twine>=6,<7'
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: verified-pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bileactome/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-pypi-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
